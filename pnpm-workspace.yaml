# pnpm 11 reads settings from here; `.npmrc` is auth/registry only, and the
# `pnpm` block in package.json no longer carries them.
overrides:
  # Astro's unifont needs this exact API; see the dependency notes.
  css-tree: 3.2.1

# Replaces `onlyBuiltDependencies`: postinstall scripts run only for these.
allowBuilds:
  "@tailwindcss/oxide": true
  better-sqlite3: true
  esbuild: true
  sharp: true
  workerd: true

# Versions allowed to bypass the 1-day release-age gate.
minimumReleaseAgeExclude:
  - "@cloudflare/workers-types@5.20260713.1"
  - "css-tree@3.2.1"
